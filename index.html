<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Pro de Licences (Architecture Modulaire)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --input-bg: #030712;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-blue: #3b82f6;
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .brand i { color: var(--accent-green); }

        .container {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 24px;
            padding: 32px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; padding: 16px; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d1d5db;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.9rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 520px;
            background-color: #030712;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #e5e7eb;
            font-family: var(--font-code);
            font-size: 0.88rem;
            line-height: 1.6;
            padding: 18px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-green {
            background-color: var(--accent-green);
            color: #000;
        }

        .btn-green:hover {
            background-color: var(--accent-green-hover);
            color: #fff;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border-color: var(--card-border);
        }

        .btn-outline:hover { background-color: var(--card-border); }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <i class="fa-solid fa-folder-tree"></i>
        <span>LicenseGen Pro (Fichiers Externe `.md`)</span>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <i class="fa-solid fa-sliders" style="color: var(--accent-blue);"></i> Configuration des Informations
        </div>

        <div class="form-group">
            <label for="licenseSelect">Modèle de Licence (Fichier `.md` source)</label>
            <select id="licenseSelect" onchange="loadAndGenerateLicense()">
                <optgroup label="Creative Commons (International v4.0)">
                    <option value="cc-by-sa-4.md">CC BY-SA 4.0 (Attribution - ShareAlike)</option>
                    <option value="cc-by-4.md">CC BY 4.0 (Attribution Pure)</option>
                    <option value="cc-by-nc-4.md">CC BY-NC 4.0 (Non Commercial)</option>
                    <option value="cc-by-nc-sa-4.md">CC BY-NC-SA 4.0 (Non Commercial - ShareAlike)</option>
                    <option value="cc-by-nd-4.md">CC BY-ND 4.0 (Pas de Modification)</option>
                    <option value="cc-by-nc-nd-4.md">CC BY-NC-ND 4.0 (Non Commercial - Pas de Modif)</option>
                    <option value="cc0.md">CC0 1.0 (Domaine Public)</option>
                </optgroup>
                <optgroup label="Assets de Jeu & Droits Stricts">
                    <option value="game-asset-strict.md">Assets de Jeu - Anti-Scraping / Anti-IA / Anti-Redistribution</option>
                    <option value="proprietary-strict.md">Licence Propriétaire - Tous Droits Réservés</option>
                </optgroup>
                <optgroup label="Open Source / Software">
                    <option value="mit.md">MIT License</option>
                    <option value="apache2.md">Apache License 2.0</option>
                    <option value="gpl3.md">GNU GPL v3.0</option>
                    <option value="bsd-3.md">BSD 3-Clause License</option>
                    <option value="mpl2.md">Mozilla Public License 2.0</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="projectName">Nom du Projet / Asset</label>
            <input type="text" id="projectName" value="Pixel Art Potion Asset Pack - 32 Colors PNG" oninput="renderLicense()">
        </div>

        <div class="form-group">
            <label for="projectUrl">URL du Projet (Lien Cliquable)</label>
            <input type="text" id="projectUrl" value="https://nathstudio.itch.io/pixel-art-potion-pack" oninput="renderLicense()">
            <span class="hint">Préfixe https:// ajouté automatiquement si absent.</span>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="authorName">Nom de l'Auteur / Titulaire</label>
                <input type="text" id="authorName" value="Nathaël Delmas" oninput="renderLicense()">
            </div>
            <div class="form-group">
                <label for="year">Année(s)</label>
                <input type="text" id="year" value="2026" oninput="renderLicense()">
            </div>
        </div>

        <div class="form-group">
            <label for="authorUrl">URL du Profil / Site Web de l'Auteur</label>
            <input type="text" id="authorUrl" value="https://nathstudio.itch.io/" oninput="renderLicense()">
        </div>

        <div class="form-group">
            <label for="creditFormat">Format d'Attribution / Crédit Obligatoire</label>
            <input type="text" id="creditFormat" value="Pixel Art Potion Asset Pack par Nathaël Delmas (https://nathstudio.itch.io/)" oninput="renderLicense()">
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fa-regular fa-file-code" style="color: var(--accent-green);"></i> Fichier <code>LICENSE.md</code> Généré
        </div>

        <textarea id="output" spellcheck="false"></textarea>

        <div class="actions">
            <button class="btn btn-outline" onclick="copyText()"><i class="fa-regular fa-copy"></i> Copier</button>
            <button class="btn btn-green" onclick="downloadFile()"><i class="fa-solid fa-download"></i> Télécharger LICENSE.md</button>
        </div>
    </div>
</div>

<script>
let rawTemplate = "";

function fixUrl(url) {
    let cleanUrl = url.trim();
    if (!cleanUrl || cleanUrl === '#') return '#';
    if (!/^https?:\/\//i.test(cleanUrl)) {
        return 'https://' + cleanUrl;
    }
    return cleanUrl;
}

// Récupère le fichier .md sélectionné dans le dossier /licenses/
async function loadAndGenerateLicense() {
    const file = document.getElementById('licenseSelect').value;
    try {
        const response = await fetch(`./licenses/${file}`);
        if (!response.ok) throw new Error("Fichier introuvable");
        rawTemplate = await response.text();
        renderLicense();
    } catch (err) {
        document.getElementById('output').value = `Erreur de chargement du fichier licenses/${file}.\nVérifiez que le fichier existe bien dans votre dépôt GitHub.`;
    }
}

// Remplace dynamiquement les balises dans le fichier .md chargé
function renderLicense() {
    if (!rawTemplate) return;

    const projName = document.getElementById('projectName').value || 'Project';
    const projUrl = fixUrl(document.getElementById('projectUrl').value);
    const author = document.getElementById('authorName').value || 'Author';
    const authorUrl = fixUrl(document.getElementById('authorUrl').value);
    const year = document.getElementById('year').value || '2026';
    const credit = document.getElementById('creditFormat').value || `${projName} by ${author}`;

    let result = rawTemplate
        .replaceAll('{PROJECT_NAME}', projName)
        .replaceAll('{PROJECT_URL}', projUrl)
        .replaceAll('{AUTHOR_NAME}', author)
        .replaceAll('{AUTHOR_URL}', authorUrl)
        .replaceAll('{YEAR}', year)
        .replaceAll('{CREDIT_FORMAT}', credit);

    document.getElementById('output').value = result;
}

function copyText() {
    const area = document.getElementById('output');
    area.select();
    navigator.clipboard.writeText(area.value);
    alert('Licence copiée !');
}

function downloadFile() {
    const text = document.getElementById('output').value;
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'LICENSE.md';
    a.click();
}

window.onload = loadAndGenerateLicense;
</script>

</body>
</html>
