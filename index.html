<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Pro de Licences avec Liens Valides</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --input-bg: #030712;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-blue: #3b82f6;
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .brand i { color: var(--accent-green); }

        .container {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 24px;
            padding: 32px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; padding: 16px; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d1d5db;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.9rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 520px;
            background-color: #030712;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #e5e7eb;
            font-family: var(--font-code);
            font-size: 0.88rem;
            line-height: 1.6;
            padding: 18px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-green {
            background-color: var(--accent-green);
            color: #000;
        }

        .btn-green:hover {
            background-color: var(--accent-green-hover);
            color: #fff;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border-color: var(--card-border);
        }

        .btn-outline:hover { background-color: var(--card-border); }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <i class="fa-solid fa-link"></i>
        <span>LicenseGen Pro (URL-Safe)</span>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <i class="fa-solid fa-sliders" style="color: var(--accent-blue);"></i> Configuration des Informations & Liens
        </div>

        <div class="form-group">
            <label for="licenseSelect">Licence Légale</label>
            <select id="licenseSelect" onchange="generateLicense()">
                <option value="cc-by-sa-4">CC BY-SA 4.0 (Creative Commons Attribution - Partage Mêmes Conditions)</option>
                <option value="cc-by-4">CC BY 4.0 (Creative Commons Attribution)</option>
                <option value="cc-by-nc-4">CC BY-NC 4.0 (Creative Commons Pas d'Usage Commercial)</option>
                <option value="cc0">CC0 1.0 (Domaine Public)</option>
                <option value="strict-asset">Licence Propriétaire Stricte (Assets de jeu / Anti-Copy)</option>
                <option value="mit">MIT License (Open Source)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="projectName">Nom du Projet / Asset</label>
            <input type="text" id="projectName" value="Pixel Art Potion Asset Pack - 32 Colors PNG" oninput="generateLicense()">
        </div>

        <div class="form-group">
            <label for="projectUrl">URL du Projet (Redirection cliquable)</label>
            <input type="text" id="projectUrl" value="https://nathstudio.itch.io/pixel-art-potion-pack" oninput="generateLicense()">
            <span class="hint">Les préfixes http:// ou https:// seront automatiquement ajoutés s'ils manquent.</span>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="authorName">Nom de l'Auteur</label>
                <input type="text" id="authorName" value="Nathaël Delmas" oninput="generateLicense()">
            </div>
            <div class="form-group">
                <label for="year">Année</label>
                <input type="text" id="year" value="2026" oninput="generateLicense()">
            </div>
        </div>

        <div class="form-group">
            <label for="authorUrl">URL du Profil / Site Web de l'Auteur</label>
            <input type="text" id="authorUrl" value="https://nathstudio.itch.io/" oninput="generateLicense()">
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fa-regular fa-file-code" style="color: var(--accent-green);"></i> Fichier <code>LICENSE.md</code> Généré
        </div>

        <textarea id="output" spellcheck="false"></textarea>

        <div class="actions">
            <button class="btn btn-outline" onclick="copyText()"><i class="fa-regular fa-copy"></i> Copier</button>
            <button class="btn btn-green" onclick="downloadFile()"><i class="fa-solid fa-download"></i> Télécharger LICENSE.md</button>
        </div>
    </div>
</div>

<script>
// Fonction qui sécurise les URLs pour qu'elles fonctionnent toujours en Markdown
function fixUrl(url) {
    let cleanUrl = url.trim();
    if (!cleanUrl || cleanUrl === '#') return '#';
    if (!/^https?:\/\//i.test(cleanUrl)) {
        return 'https://' + cleanUrl;
    }
    return cleanUrl;
}

const templates = {
    "cc-by-sa-4": `# Creative Commons Attribution-ShareAlike 4.0 International Public License

Work: [{PROJECT_NAME}]({PROJECT_URL})
Copyright (c) {YEAR} [{AUTHOR_NAME}]({AUTHOR_URL})

This work is licensed under the **Creative Commons Attribution-ShareAlike 4.0 International License**.

### Terms Summary:
You are free to:
- **Share**: Copy and redistribute the material in any medium or format.
- **Adapt**: Remix, transform, and build upon the material for any purpose, even commercially.

Under the following conditions:
- **Attribution**: You must give appropriate credit to [{AUTHOR_NAME}]({AUTHOR_URL}), provide a link to the license, and indicate if changes were made.
- **ShareAlike**: If you remix, transform, or build upon the material, you must distribute your contributions under the same license as the original.

### Official Deed & Legal Text:
To view a full copy of this license, visit:
[https://creativecommons.org/licenses/by-sa/4.0/](https://creativecommons.org/licenses/by-sa/4.0/) or read the official Legal Code at [https://creativecommons.org/licenses/by-sa/4.0/legalcode](https://creativecommons.org/licenses/by-sa/4.0/legalcode).`,

    "cc-by-4": `# Creative Commons Attribution 4.0 International Public License

Work: [{PROJECT_NAME}]({PROJECT_URL})
Copyright (c) {YEAR} [{AUTHOR_NAME}]({AUTHOR_URL})

This work is licensed under the **Creative Commons Attribution 4.0 International License**.

### Terms Summary:
You are free to:
- **Share**: Copy and redistribute the material in any medium or format.
- **Adapt**: Remix, transform, and build upon the material for any purpose, even commercially.

Under the following conditions:
- **Attribution**: You must give appropriate credit to [{AUTHOR_NAME}]({AUTHOR_URL}), provide a link to the license, and indicate if changes were made.

### Official Deed & Legal Text:
[https://creativecommons.org/licenses/by/4.0/](https://creativecommons.org/licenses/by/4.0/)`,

    "cc-by-nc-4": `# Creative Commons Attribution-NonCommercial 4.0 License

Work: [{PROJECT_NAME}]({PROJECT_URL})
Copyright (c) {YEAR} [{AUTHOR_NAME}]({AUTHOR_URL})

This work is licensed under the **CC BY-NC 4.0 License**.

Commercial use of [{PROJECT_NAME}]({PROJECT_URL}) is strictly prohibited without written consent from [{AUTHOR_NAME}]({AUTHOR_URL}).

### Official Deed:
[https://creativecommons.org/licenses/by-nc/4.0/](https://creativecommons.org/licenses/by-nc/4.0/)`,

    "cc0": `# CC0 1.0 Universal (Public Domain Dedication)

Work: [{PROJECT_NAME}]({PROJECT_URL})
Dedicated by: [{AUTHOR_NAME}]({AUTHOR_URL}) ({YEAR})

### Official Legal Text:
[https://creativecommons.org/publicdomain/zero/1.0/](https://creativecommons.org/publicdomain/zero/1.0/)`,

    "strict-asset": `# Proprietary Game Asset License

Asset Name: [{PROJECT_NAME}]({PROJECT_URL})
Author: [{AUTHOR_NAME}]({AUTHOR_URL})
Copyright (c) {YEAR} [{AUTHOR_NAME}]({AUTHOR_URL}). All Rights Reserved.

### Conditions:
1. You may use [{PROJECT_NAME}]({PROJECT_URL}) in your published games or projects.
2. You CANNOT resell, redistribute, or share the source files.
3. Training AI models using this asset is explicitly prohibited.`,

    "mit": `# MIT License

Copyright (c) {YEAR} [{AUTHOR_NAME}]({AUTHOR_URL}) - [{PROJECT_NAME}]({PROJECT_URL})

Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files.`
};

function generateLicense() {
    const key = document.getElementById('licenseSelect').value;
    const template = templates[key];

    const projName = document.getElementById('projectName').value || 'Project';
    const projUrl = fixUrl(document.getElementById('projectUrl').value);
    const author = document.getElementById('authorName').value || 'Author';
    const authorUrl = fixUrl(document.getElementById('authorUrl').value);
    const year = document.getElementById('year').value || '2026';

    let result = template
        .replaceAll('{PROJECT_NAME}', projName)
        .replaceAll('{PROJECT_URL}', projUrl)
        .replaceAll('{AUTHOR_NAME}', author)
        .replaceAll('{AUTHOR_URL}', authorUrl)
        .replaceAll('{YEAR}', year);

    document.getElementById('output').value = result;
}

function copyText() {
    const area = document.getElementById('output');
    area.select();
    navigator.clipboard.writeText(area.value);
    alert('Licence copiée avec liens valides !');
}

function downloadFile() {
    const text = document.getElementById('output').value;
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'LICENSE.md';
    a.click();
}

window.onload = generateLicense;
</script>

</body>
</html>
